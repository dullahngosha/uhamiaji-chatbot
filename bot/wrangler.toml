# Mr. HamaHama — bot ya Messenger/Instagram (Cloudflare Worker)
# Secrets huwekwa kwa `npx wrangler secret put JINA` (tazama bot/README.md), kamwe si hapa.
name = "hamahama-bot"
main = "worker.js"
compatibility_date = "2026-09-01"

[vars]
KB_URL = "https://dullahngosha.github.io/uhamiaji-chatbot/data/knowledge.json"

# Hiari: kumbukumbu fupi (lugha na orodha ya mwisho). Tengeneza kwa:
#   npx wrangler kv namespace create hamahama-state
# kisha weka id hapa na uondoe alama za maoni.
# [[kv_namespaces]]
# binding = "STATE"
# id = "WEKA_ID_HAPA"
