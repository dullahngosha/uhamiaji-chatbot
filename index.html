<!doctype html>
<html lang="sw">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Mr. HamaHama — Jaribio</title>
  <style>
    body{margin:0;min-height:100vh;background:linear-gradient(135deg,#0b2350,#24488c);font-family:Arial,sans-serif;color:#10213a}
    .wrap{max-width:1000px;margin:40px auto;padding:0 16px}
    header{background:#0b2a6b;color:#fff;border-radius:14px 14px 0 0;padding:28px;border-bottom:4px solid #e0b40f}
    header h1{margin:0;font-size:34px;letter-spacing:.02em}header h1 span{color:#e0b40f}
    header p{margin:8px 0 0;color:#f3c623;font-style:italic}
    main{background:#f4f7fb;border-radius:0 0 14px 14px;padding:28px;line-height:1.6}
    button.demo{margin:4px 6px 4px 0;padding:8px 12px;border:1px solid #0b2a6b;border-radius:8px;background:#fff;color:#0b2a6b;cursor:pointer}
  </style>
</head>
<body>
  <div class="wrap">
    <header><h1>UHAMIAJI <span>TANZANIA</span></h1><p>Karibu kwenye Blogu Rasmi ya Idara ya Uhamiaji</p></header>
    <main>
      <p>Ukurasa huu ni wa kujaribu Mr. HamaHama v2. Bofya <b>“Ask Me!”</b> chini kulia.</p>
      <p>Viungo vya moja kwa moja (vinaweza kuwekwa ndani ya posti za blog):</p>
      <button class="demo" onclick="HamaHama.show('passport.apply')">Ninaombaje pasipoti?</button>
      <button class="demo" onclick="HamaHama.show('visa.apply')">Visa ya Tanzania</button>
      <button class="demo" onclick="HamaHama.ask('pasipoti imepotea')">Pasipoti imepotea</button>
    </main>
  </div>
  <script src="./embed.js" defer></script>
</body>
</html>
